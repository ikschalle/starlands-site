---
layout: default
title: Characters
permalink: /characters/
---

<div class="character-index">
{% for character in site.characters %}
    <a class="character-index-box" href="{{ character.url | relative_url }}">
      <img src="{{site.baseurl}}/assets/img/characters/thumb/{{character.uid}}.png" alt="{{character.name}}">
      <p>{{ character.name }}</p>
    </a>
{% endfor %}
</div>

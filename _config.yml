url: "https://stardoods.github.io"
title: starlands

collections:
  characters:
    output: true
    permalink: /characters/:name/

# Markdown newline activator 
kramdown:
  input: GFM
  hard_wrap: true

# Exclude from processing

defaults:
  -
    scope:
      path: ""
      type: "characters"
    values: 
      layout: "character"

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
